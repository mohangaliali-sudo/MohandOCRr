name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libltdl-dev python3-setuptools zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install "cython<3.0.0" buildozer
        - name: Clean Buildozer Cache
          run: |
        rm -rf .buildozer/
    - name: Build with Buildozer
      run: |
        buildozer -v android debug
