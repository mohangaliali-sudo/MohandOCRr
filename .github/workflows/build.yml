name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # System packages
      # =====================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # =====================================================
      # Python packages
      # =====================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # =====================================================
      # Verify project
      # =====================================================

      - name: Verify project
        run: |

          echo "=============================="
          echo "PROJECT"
          echo "=============================="

          find . -maxdepth 3 -type f | sort

          echo
          echo "=============================="
          echo "TFLITE MODEL"
          echo "=============================="

          test -f assets/best.tflite

          ls -lh assets/best.tflite

          echo
          echo "=============================="
          echo "RECIPE"
          echo "=============================="

          test -f p4a-recipes/tflite-runtime/__init__.py

          ls -lh p4a-recipes/tflite-runtime/__init__.py

          echo
          echo "Recipe:"
          sed -n '1,240p' p4a-recipes/tflite-runtime/__init__.py


      # =====================================================
      # Verify buildozer.spec
      # =====================================================

      - name: Verify Buildozer configuration
        run: |

          echo "=============================="
          echo "BUILDOZER SPEC"
          echo "=============================="

          sed -n '1,240p' buildozer.spec


      # =====================================================
      # Cache Buildozer
      # =====================================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: |
            buildozer-${{ runner.os }}-${{ hashFiles(
              'buildozer.spec',
              'p4a-recipes/tflite-runtime/__init__.py'
            ) }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # =====================================================
      # Build APK
      # =====================================================

      - name: Build APK
        env:
          P4A_tflite_runtime_DIR: ${{ github.workspace }}/p4a-recipes/tflite-runtime
        run: |

          echo "=============================="
          echo "BUILDING APK"
          echo "=============================="

          buildozer -v android debug


      # =====================================================
      # Show output
      # =====================================================

      - name: List APK
        if: always()
        run: |

          echo "=============================="
          echo "APK OUTPUT"
          echo "=============================="

          find bin -type f -maxdepth 2 -print 2>/dev/null || true


      # =====================================================
      # Upload APK
      # =====================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MohandOCR-APK
          path: bin/*.apk
          if-no-files-found: error
