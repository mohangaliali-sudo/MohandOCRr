name: Build Android APK

on:

  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # =====================================================
      # 2. PYTHON 3.11
      # =====================================================

      - name: Set up Python 3.11

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # 3. JAVA 17
      # =====================================================

      - name: Set up Java 17

        uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # 4. VERIFY JAVA
      # =====================================================

      - name: Verify Java

        run: |

          set -e

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version

          javac -version


      # =====================================================
      # 5. SYSTEM DEPENDENCIES
      # =====================================================

      - name: Install system dependencies

        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            wget \
            curl \
            p7zip-full


      # =====================================================
      # 6. PYTHON PACKAGES
      # =====================================================

      - name: Install Python build tools

        run: |

          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37


      # =====================================================
      # 7. VERIFY BUILD TOOLS
      # =====================================================

      - name: Check versions

        run: |

          set -e

          echo "========================================"
          echo "VERSIONS"
          echo "========================================"

          python --version

          pip --version

          buildozer --version

          cython --version


      # =====================================================
      # 8. CHECK PROJECT
      # =====================================================

      - name: Check project files

        run: |

          set -e

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type f \
            ! -path "./.git/*" \
            | sort


      # =====================================================
      # 9. CHECK MODEL
      # =====================================================

      - name: Check TFLite model

        run: |

          set -e

          echo "========================================"
          echo "TFLITE MODEL"
          echo "========================================"

          test -f assets/best.tflite

          ls -lh assets/best.tflite

          SIZE=$(stat -c%s assets/best.tflite)

          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then

            echo "ERROR:"
            echo "best.tflite appears too small."

            exit 1

          fi

          echo "TFLite model OK."


      # =====================================================
      # 10. CHECK FONTS
      # =====================================================

      - name: Check fonts

        run: |

          set -e

          echo "========================================"
          echo "FONTS"
          echo "========================================"

          test -f \
            assets/fonts/Cairo-Regular.ttf

          test -f \
            assets/fonts/NotoSansDevanagari-Regular.ttf

          test -f \
            assets/fonts/Roboto-Regular.ttf

          ls -lh assets/fonts/*.ttf

          echo "Fonts OK."


      # =====================================================
      # 11. CHECK CLASSES
      # =====================================================

      - name: Check classes

        run: |

          set -e

          echo "========================================"
          echo "CLASSES"
          echo "========================================"

          test -f classes.txt

          cat -n classes.txt

          CLASS_COUNT=$(wc -l < classes.txt)

          echo ""

          echo "Class count: $CLASS_COUNT"

          if [ "$CLASS_COUNT" -ne 46 ]; then

            echo ""
            echo "ERROR:"
            echo "Expected 46 classes."

            exit 1

          fi

          echo ""
          echo "Classes OK."


      # =====================================================
      # 12. CHECK PYTHON SYNTAX
      # =====================================================

      - name: Check Python syntax

        run: |

          set -e

          echo "========================================"
          echo "PYTHON SYNTAX"
          echo "========================================"

          python -m py_compile main.py

          python -m py_compile ocr_processor.py

          echo "Python syntax OK."


      # =====================================================
      # 13. CHECK BUILDOZER SPEC
      # =====================================================

      - name: Check buildozer.spec

        run: |

          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          test -f buildozer.spec

          cat buildozer.spec


      # =====================================================
      # 14. VALIDATE TFLITE REQUIREMENT
      # =====================================================

      - name: Validate TFLite requirement

        run: |

          set -e

          echo "========================================"
          echo "TFLITE REQUIREMENT"
          echo "========================================"

          grep -E "^requirements" buildozer.spec || true

          echo ""

          grep -E "ai-edge-litert" \
            buildozer.spec

          echo ""

          echo "TFLite requirement detected."


      # =====================================================
      # 15. CACHE BUILDOZER
      # =====================================================

      - name: Cache Buildozer

        uses: actions/cache@v4

        with:

          path: |
            .buildozer
            ~/.buildozer

          key: >
            ${{ runner.os }}-
            buildozer-
            ${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            ${{ runner.os }}-buildozer-


      # =====================================================
      # 16. TEST INTERNET
      # =====================================================

      - name: Test download connection

        run: |

          set +e

          echo "========================================"
          echo "NETWORK TEST"
          echo "========================================"

          curl \
            --fail \
            --location \
            --connect-timeout 30 \
            --max-time 60 \
            -I \
            https://github.com

          if [ $? -eq 0 ]; then

            echo ""
            echo "Network OK."

          else

            echo ""
            echo "WARNING:"
            echo "Network test failed."

          fi

          exit 0


      # =====================================================
      # 17. BUILDOZER BUILD
      # =====================================================

      - name: Build Android APK

        env:

          P4A_DOWNLOAD_RETRIES: "10"

          P4A_DOWNLOAD_TIMEOUT: "180"

        run: |

          set -e

          echo "========================================"
          echo "BUILD ANDROID APK"
          echo "========================================"

          echo ""

          echo "Python:"
          python --version

          echo ""

          echo "Java:"
          java -version

          echo ""

          echo "Buildozer:"
          buildozer --version

          echo ""

          echo "Starting Buildozer..."

          buildozer \
            -v \
            android \
            debug


      # =====================================================
      # 18. FIND APK
      # =====================================================

      - name: Find APK

        if: success()

        run: |

          set -e

          echo "========================================"
          echo "APK"
          echo "========================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # =====================================================
      # 19. VERIFY APK
      # =====================================================

      - name: Verify APK

        if: success()

        run: |

          set -e

          APK_COUNT=$(
            find bin \
            -type f \
            -name "*.apk" \
            | wc -l
          )

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR:"
            echo "APK was not generated."

            exit 1

          fi

          echo ""
          echo "APK generated successfully."


      # =====================================================
      # 20. UPLOAD APK
      # =====================================================

      - name: Upload APK

        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-APK

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 30


      # =====================================================
      # 21. UPLOAD BUILD LOGS
      # =====================================================

      - name: Upload build logs

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-build-logs

          path: |
            .buildozer/
            ~/.buildozer/

          if-no-files-found: ignore

          retention-days: 7
