name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON 3.11
      # ======================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # JAVA 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # ======================================================
      # SYSTEM PACKAGES
      # ======================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python build tools
        run: |

          python --version

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer \
            "Cython==0.29.37"


      # ======================================================
      # VERIFY ENVIRONMENT
      # ======================================================

      - name: Verify environment
        run: |

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Java:"
          java -version

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"


      # ======================================================
      # CLEAN OLD BUILD
      # ======================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # BUILD AAB
      # ======================================================

      - name: Build Android AAB
        env:
          P4A_DOWNLOAD_TIMEOUT: "180"
          P4A_DOWNLOAD_RETRIES: "10"

        run: |

          buildozer android clean

          buildozer -v android debug


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohand-Sanskrit-OCR-APK
          path: bin/*.apk
          if-no-files-found: error
