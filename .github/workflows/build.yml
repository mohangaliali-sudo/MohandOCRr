name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            build-essential \
            ccache \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            gettext \
            autopoint \
            texinfo \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev


      # ======================================================
      # PYTHON PACKAGES
      # ======================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            packaging

          python -m pip install \
            "Cython==0.29.37"

          python -m pip install \
            "buildozer==1.6.0"


      # ======================================================
      # VERIFY PROJECT
      # ======================================================

      - name: Verify project files
        run: |

          echo "=============================="
          echo "PROJECT"
          echo "=============================="

          find . -maxdepth 4 -type f | sort

          echo ""
          echo "=============================="
          echo "TFLITE MODEL"
          echo "=============================="

          if [ ! -f "assets/best.tflite" ]; then
            echo "ERROR: assets/best.tflite not found"
            exit 1
          fi

          ls -lh assets/best.tflite

          echo ""
          echo "=============================="
          echo "CLASSES"
          echo "=============================="

          if [ ! -f "classes.txt" ]; then
            echo "ERROR: classes.txt not found"
            exit 1
          fi

          wc -l classes.txt

          echo ""
          echo "=============================="
          echo "FONTS"
          echo "=============================="

          find assets/fonts -type f -name "*.ttf" -print


      # ======================================================
      # VERIFY RECIPE
      # ======================================================

      - name: Verify TFLite recipe
        run: |

          echo "=============================="
          echo "P4A LOCAL RECIPE"
          echo "=============================="

          if [ ! -f "p4a-recipes/tflite-runtime/recipe.py" ]; then
            echo "ERROR: tflite-runtime recipe not found"
            exit 1
          fi

          sed -n '1,240p' \
            p4a-recipes/tflite-runtime/recipe.py


      # ======================================================
      # CLEAN BUILD
      # ======================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf ~/.buildozer


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

        run: |

          buildozer -v android debug


      # ======================================================
      # SHOW APK
      # ======================================================

      - name: Show APK
        if: always()
        run: |

          echo "=============================="
          echo "BIN DIRECTORY"
          echo "=============================="

          ls -lah bin/ || true


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: MohandOCR-APK
          path: bin/*.apk
          if-no-files-found: error
