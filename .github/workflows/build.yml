name: Build Android APK

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # Project verification
      # =====================================================

      - name: Verify project
        shell: bash

        run: |

          set -eux

          echo "================================"
          echo "PROJECT"
          echo "================================"

          find . \
            -maxdepth 4 \
            -type f \
            -not -path './.git/*' \
            | sort

          echo ""
          echo "================================"
          echo "MODEL"
          echo "================================"

          test -f assets/best.tflite

          ls -lh assets/best.tflite

          echo ""
          echo "================================"
          echo "RECIPE"
          echo "================================"

          test -f \
            p4a-recipes/tflite-runtime/__init__.py


      # =====================================================
      # Download TFLite Runtime
      # =====================================================

      - name: Download TFLite Runtime ARM64
        shell: bash

        run: |

          set -eux

          mkdir -p \
            p4a-recipes/tflite-runtime

          curl \
            -L \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            -o \
            p4a-recipes/tflite-runtime/tflite-runtime-android-arm64-2.19.0.tgz \
            https://github.com/DeNA/tflite-runtime-builder/releases/download/2.19.0/tflite-runtime-android-arm64-2.19.0.tgz

          ls -lh \
            p4a-recipes/tflite-runtime/tflite-runtime-android-arm64-2.19.0.tgz


      # =====================================================
      # Verify archive
      # =====================================================

      - name: Inspect TFLite archive
        shell: bash

        run: |

          set -eux

          tar -tzf \
            p4a-recipes/tflite-runtime/tflite-runtime-android-arm64-2.19.0.tgz


      # =====================================================
      # Dependencies
      # =====================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache


      # =====================================================
      # Buildozer
      # =====================================================

      - name: Install Buildozer
        run: |

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37


      # =====================================================
      # Versions
      # =====================================================

      - name: Versions
        run: |

          python --version

          buildozer --version

          java -version


      # =====================================================
      # Build
      # =====================================================

      - name: Build APK
        run: |

          buildozer \
            -v \
            android \
            debug


      # =====================================================
      # Find APK
      # =====================================================

      - name: Find APK
        if: success()

        run: |

          echo "================================"
          echo "APK"
          echo "================================"

          find bin \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # =====================================================
      # Upload APK
      # =====================================================

      - name: Upload APK
        if: success()

        uses: actions/upload-artifact@v4

        with:

          name: MohandOCR-APK

          path: bin/*.apk

          if-no-files-found: error
