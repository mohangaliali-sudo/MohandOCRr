name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. HOST PYTHON
      # ======================================================

      - name: Set up host Python 3.11
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ======================================================
      # 3. SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            wget \
            curl \
            p7zip-full


      # ======================================================
      # 4. JAVA
      # ======================================================

      - name: Configure Java 17
        run: |

          set -e

          JAVA_HOME_PATH="/usr/lib/jvm/java-17-openjdk-amd64"

          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"

          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

          java -version


      # ======================================================
      # 5. PYTHON INFORMATION
      # ======================================================

      - name: Show Python
        run: |

          set -e

          python --version

          python -c "import sys; print(sys.version)"


      # ======================================================
      # 6. INSTALL BUILDOZER
      # ======================================================

      - name: Install Buildozer
        run: |

          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37

          echo ""
          echo "========================================"
          echo "BUILDOZER"
          echo "========================================"

          buildozer --version

          echo ""
          echo "========================================"
          echo "CYTHON"
          echo "========================================"

          cython --version


      # ======================================================
      # 7. CHECK PROJECT
      # ======================================================

      - name: Check project files
        run: |

          set -e

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type f \
            ! -path "./.git/*" \
            ! -path "./.buildozer/*" \
            | sort


      # ======================================================
      # 8. CHECK MODEL
      # ======================================================

      - name: Check TFLite model
        run: |

          set -e

          echo "========================================"
          echo "TFLITE MODEL"
          echo "========================================"

          test -f assets/best.tflite

          ls -lh assets/best.tflite

          SIZE=$(stat -c%s assets/best.tflite)

          echo ""
          echo "Model size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then

            echo ""
            echo "ERROR:"
            echo "best.tflite appears too small."

            exit 1

          fi

          echo ""
          echo "TFLite model exists."


      # ======================================================
      # 9. CHECK FONTS
      # ======================================================

      - name: Check fonts
        run: |

          set -e

          echo "========================================"
          echo "FONTS"
          echo "========================================"

          test -f assets/fonts/Cairo-Regular.ttf

          test -f assets/fonts/NotoSansDevanagari-Regular.ttf

          test -f assets/fonts/Roboto-Regular.ttf

          ls -lh assets/fonts/*.ttf

          echo ""
          echo "Fonts OK."


      # ======================================================
      # 10. CHECK CLASSES
      # ======================================================

      - name: Check classes
        run: |

          set -e

          echo "========================================"
          echo "CLASSES"
          echo "========================================"

          test -f classes.txt

          python - <<'PY'

          from pathlib import Path

          path = Path("classes.txt")

          text = path.read_text(
              encoding="utf-8-sig"
          )

          lines = [
              line.strip()
              for line in text.splitlines()
              if line.strip()
          ]

          print("Classes:")

          for index, name in enumerate(lines):

              print(
                  f"ID {index:02d} -> {name}"
              )

          print()

          print(
              f"TOTAL CLASSES = {len(lines)}"
          )

          if len(lines) != 46:

              raise SystemExit(
                  "ERROR: classes.txt must contain exactly 46 classes."
              )

          print(
              "SUCCESS: 46 classes."
          )

          PY


      # ======================================================
      # 11. PYTHON SYNTAX
      # ======================================================

      - name: Check Python syntax
        run: |

          set -e

          python -m py_compile main.py

          python -m py_compile ocr_processor.py

          echo "Python syntax OK."


      # ======================================================
      # 12. CHECK BUILDOZER
      # ======================================================

      - name: Check buildozer.spec
        run: |

          set -e

          test -f buildozer.spec

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          cat buildozer.spec


      # ======================================================
      # 13. VERIFY CRITICAL SETTINGS
      # ======================================================

      - name: Validate build configuration
        run: |

          set -e

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo ""
          echo "Python requirement:"

          grep "python3==3.11.9" \
            buildozer.spec

          echo ""
          echo "TFLite runtime:"

          grep "tflite-runtime" \
            buildozer.spec

          echo ""
          echo "Architecture:"

          grep "android.archs" \
            buildozer.spec

          echo ""
          echo "API:"

          grep "android.api" \
            buildozer.spec

          echo ""
          echo "Min API:"

          grep "android.minapi" \
            buildozer.spec

          echo ""
          echo "Configuration checks passed."


      # ======================================================
      # 14. CACHE
      # ======================================================

      - name: Cache Buildozer
        uses: actions/cache@v4

        with:

          path: |
            .buildozer
            ~/.buildozer

          key: ${{ runner.os }}-buildozer-python311-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            ${{ runner.os }}-buildozer-python311-
            ${{ runner.os }}-buildozer-


      # ======================================================
      # 15. CLEAN OLD BUILD
      # ======================================================

      - name: Clean previous Buildozer state
        run: |

          set -e

          rm -rf .buildozer

          echo "Old .buildozer directory removed."


      # ======================================================
      # 16. BUILD APK
      # ======================================================

      - name: Build Android APK
        env:

          P4A_DOWNLOAD_RETRIES: "10"

          P4A_DOWNLOAD_TIMEOUT: "180"

        run: |

          set -e

          echo "========================================"
          echo "ANDROID BUILD"
          echo "========================================"

          echo ""
          echo "Host Python:"

          python --version

          echo ""
          echo "Buildozer:"

          buildozer --version

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # ======================================================
      # 17. FIND APK
      # ======================================================

      - name: Find APK
        if: success()
        run: |

          set -e

          echo "========================================"
          echo "APK"
          echo "========================================"

          find bin \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ======================================================
      # 18. VERIFY APK
      # ======================================================

      - name: Verify APK
        if: success()
        run: |

          set -e

          APK_COUNT=$(
            find bin \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR:"
            echo "APK was not generated."

            exit 1

          fi

          echo ""
          echo "APK generated successfully."


      # ======================================================
      # 19. UPLOAD APK
      # ======================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-APK

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 30


      # ======================================================
      # 20. UPLOAD LOGS ON FAILURE
      # ======================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-build-logs

          path: |
            .buildozer/
            ~/.buildozer/

          if-no-files-found: ignore

          retention-days: 7
