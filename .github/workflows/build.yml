name: Build Android APK

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON 3.11
      # ======================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"


      # ======================================================
      # JAVA 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # SYSTEM DEPENDENCIES
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache


      # ======================================================
      # PYTHON BUILD TOOLS
      # ======================================================

      - name: Install build tools
        run: |
          python --version
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            "Cython==0.29.37"


      # ======================================================
      # VERIFY
      # ======================================================

      - name: Verify environment
        run: |
          echo "========================================"
          echo "Python"
          python --version
          which python

          echo "========================================"
          echo "Buildozer"
          buildozer --version

          echo "========================================"
          echo "Java"
          java -version

          echo "========================================"
          echo "Project files"
          find . -maxdepth 3 -type f | sort

          echo "========================================"
          echo "buildozer.spec"
          test -f buildozer.spec

          echo "========================================"
          echo "main.py"
          test -f main.py

          echo "========================================"
          echo "ocr_processor.py"
          test -f ocr_processor.py

          echo "========================================"
          echo "best.tflite"
          test -f assets/best.tflite

          echo "========================================"
          echo "classes.txt"
          test -f classes.txt


      # ======================================================
      # CLEAN
      # ======================================================

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build Android APK
        env:
          P4A_DOWNLOAD_TIMEOUT: "180"
          P4A_DOWNLOAD_RETRIES: "10"

        run: |
          buildozer -v android debug


      # ======================================================
      # CHECK APK
      # ======================================================

      - name: Check APK
        run: |
          echo "========================================"
          echo "APK files:"
          find bin -type f -name "*.apk" -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohand-Sanskrit-OCR-APK
          path: bin/*.apk
          if-no-files-found: error
