name: Build Android APK

on:

  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # JAVA
      # =====================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =====================================================
      # LINUX DEPENDENCIES
      # =====================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            gettext \
            texinfo \
            cmake \
            ccache \
            build-essential \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            lbzip2 \
            patch \
            wget


      # =====================================================
      # PYTHON PACKAGES
      # =====================================================

      - name: Install Buildozer
        run: |

          python -m pip install \
            --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.6.0 \
            packaging


      # =====================================================
      # INSTALL MODERN PYTHON-FOR-ANDROID
      # =====================================================

      - name: Install python-for-android
        run: |

          python -m pip install \
            "python-for-android @ git+https://github.com/kivy/python-for-android.git@develop"


      # =====================================================
      # VERSION CHECK
      # =====================================================

      - name: Show versions
        run: |

          echo "=============================="
          echo "Python"
          python --version

          echo "=============================="
          echo "Buildozer"
          buildozer --version

          echo "=============================="
          echo "Java"
          java -version

          echo "=============================="
          echo "P4A"
          p4a --version || true


      # =====================================================
      # VERIFY PROJECT
      # =====================================================

      - name: Verify project files
        run: |

          echo "=============================="
          echo "Project"
          echo "=============================="

          find . \
            -maxdepth 4 \
            -type f \
            | sort

          echo "=============================="
          echo "TFLite model"
          echo "=============================="

          ls -lh \
            assets/best.tflite

          echo "=============================="
          echo "Classes"
          echo "=============================="

          ls -lh \
            classes.txt

          echo "=============================="
          echo "Recipe"
          echo "=============================="

          find p4a-recipes \
            -maxdepth 3 \
            -type f \
            | sort


      # =====================================================
      # CLEAN
      # =====================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer

          rm -rf ~/.buildozer


      # =====================================================
      # BUILD
      # =====================================================

      - name: Build Android APK
        run: |

          buildozer -v android debug


      # =====================================================
      # LIST APK
      # =====================================================

      - name: Show generated APK
        run: |

          echo "=============================="
          echo "Generated APK"
          echo "=============================="

          ls -lah bin/


      # =====================================================
      # UPLOAD APK
      # =====================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: MohandOCR-APK

          path: bin/*.apk

          if-no-files-found: error
