name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON 3.11
      # =========================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. SYSTEM DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache \
            wget \
            curl \
            p7zip-full


      # =========================================================
      # 4. JAVA 17
      # =========================================================

      - name: Configure Java 17
        run: |

          set -e

          JAVA_HOME_PATH=$(dirname $(dirname $(readlink -f $(which javac))))

          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_PATH/bin" >> "$GITHUB_PATH"

          echo "JAVA_HOME=$JAVA_HOME_PATH"

          java -version


      # =========================================================
      # 5. INSTALL BUILDOZER
      # =========================================================

      - name: Install Buildozer
        run: |

          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            Cython==0.29.37

          echo ""
          echo "========================================"
          echo "VERSIONS"
          echo "========================================"

          python --version
          buildozer --version
          cython --version


      # =========================================================
      # 6. CHECK PROJECT
      # =========================================================

      - name: Check project files
        run: |

          set -e

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type f \
            ! -path "./.git/*" \
            | sort


      # =========================================================
      # 7. CHECK MODEL
      # =========================================================

      - name: Check TFLite model
        run: |

          set -e

          echo "========================================"
          echo "CHECK TFLITE MODEL"
          echo "========================================"

          test -f assets/best.tflite

          ls -lh assets/best.tflite

          SIZE=$(stat -c%s assets/best.tflite)

          echo ""
          echo "Model size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo ""
            echo "ERROR: best.tflite appears too small."
            exit 1
          fi

          echo ""
          echo "TFLite model OK."


      # =========================================================
      # 8. CHECK FONTS
      # =========================================================

      - name: Check fonts
        run: |

          set -e

          echo "========================================"
          echo "CHECK FONTS"
          echo "========================================"

          test -f assets/fonts/Cairo-Regular.ttf
          test -f assets/fonts/NotoSansDevanagari-Regular.ttf
          test -f assets/fonts/Roboto-Regular.ttf

          echo ""
          echo "Cairo:"
          ls -lh assets/fonts/Cairo-Regular.ttf

          echo ""
          echo "Devanagari:"
          ls -lh assets/fonts/NotoSansDevanagari-Regular.ttf

          echo ""
          echo "Roboto:"
          ls -lh assets/fonts/Roboto-Regular.ttf

          echo ""
          echo "All fonts OK."


      # =========================================================
      # 9. CHECK CLASSES
      # =========================================================

      - name: Check classes
        run: |

          set -e

          echo "========================================"
          echo "CHECK CLASSES"
          echo "========================================"

          test -f classes.txt

          python - <<'PY'

          from pathlib import Path

          path = Path("classes.txt")

          text = path.read_text(
              encoding="utf-8-sig"
          )

          lines = text.splitlines()

          # Remove empty lines
          lines = [
              line.strip()
              for line in lines
              if line.strip()
          ]

          print()
          print("CLASS INDEX TABLE")
          print("----------------------------------------")

          for index, name in enumerate(lines):

              print(
                  f"ID {index:02d} -> {name}"
              )

          print("----------------------------------------")
          print(f"TOTAL CLASSES = {len(lines)}")

          if len(lines) != 46:

              print()
              print(
                  "ERROR: classes.txt must contain exactly 46 classes."
              )

              print(
                  "Expected class IDs: 0 through 45."
              )

              raise SystemExit(1)

          print()
          print(
              "SUCCESS: classes.txt contains exactly 46 classes."
          )

          PY


      # =========================================================
      # 10. CHECK PYTHON SYNTAX
      # =========================================================

      - name: Check Python syntax
        run: |

          set -e

          echo "========================================"
          echo "PYTHON SYNTAX"
          echo "========================================"

          python -m py_compile main.py
          echo "main.py syntax OK"

          python -m py_compile ocr_processor.py
          echo "ocr_processor.py syntax OK"


      # =========================================================
      # 11. CHECK BUILDOZER SPEC
      # =========================================================

      - name: Check buildozer.spec
        run: |

          set -e

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          test -f buildozer.spec

          cat buildozer.spec


      # =========================================================
      # 12. VALIDATE BUILDOZER SPEC
      # =========================================================

      - name: Validate buildozer.spec
        run: |

          set -e

          echo "========================================"
          echo "VALIDATING BUILDOZER SPEC"
          echo "========================================"

          echo ""
          echo "Requirements:"
          grep -E "^requirements" buildozer.spec || true

          echo ""
          echo "Included extensions:"
          grep -E "^source.include_exts" buildozer.spec || true

          echo ""
          echo "Architecture:"
          grep -E "^android.archs" buildozer.spec || true

          echo ""
          echo "Android API:"
          grep -E "^android.api" buildozer.spec || true

          echo ""
          echo "Minimum API:"
          grep -E "^android.minapi" buildozer.spec || true


      # =========================================================
      # 13. CACHE BUILDOZER
      # =========================================================

      - name: Cache Buildozer
        uses: actions/cache@v4

        with:

          path: |
            .buildozer
            ~/.buildozer

          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

          restore-keys: |
            ${{ runner.os }}-buildozer-


      # =========================================================
      # 14. SHOW CACHE STATUS
      # =========================================================

      - name: Show Buildozer cache
        run: |

          echo "========================================"
          echo "BUILDOZER CACHE"
          echo "========================================"

          if [ -d ".buildozer" ]; then
            echo ".buildozer exists"
            du -sh .buildozer || true
          else
            echo ".buildozer does not exist yet"
          fi

          if [ -d "$HOME/.buildozer" ]; then
            echo "$HOME/.buildozer exists"
            du -sh "$HOME/.buildozer" || true
          else
            echo "$HOME/.buildozer does not exist yet"
          fi


      # =========================================================
      # 15. FREETYPE CONNECTION TEST
      # =========================================================

      - name: Test FreeType server
        run: |

          set +e

          URL="https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"

          echo "========================================"
          echo "TEST FREETYPE DOWNLOAD"
          echo "========================================"

          SUCCESS=0

          for i in 1 2 3 4 5
          do

            echo ""
            echo "Attempt $i / 5"

            curl \
              --fail \
              --location \
              --retry 2 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 180 \
              -o /tmp/freetype.tar.gz \
              "$URL"

            if [ $? -eq 0 ]; then

              echo ""
              echo "FreeType download successful."

              ls -lh /tmp/freetype.tar.gz

              SUCCESS=1

              break

            fi

            echo "Download failed."

            sleep 10

          done

          if [ "$SUCCESS" -eq 0 ]; then

            echo ""
            echo "WARNING:"
            echo "FreeType server could not be reached."
            echo "python-for-android will try its own download."

          fi

          exit 0


      # =========================================================
      # 16. BUILD APK
      # =========================================================

      - name: Build Android APK
        env:

          P4A_DOWNLOAD_RETRIES: "10"

          P4A_DOWNLOAD_TIMEOUT: "180"

        run: |

          set -e

          echo "========================================"
          echo "START ANDROID BUILD"
          echo "========================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "========================================"
          echo "BUILD"
          echo "========================================"

          buildozer -v android debug


      # =========================================================
      # 17. FIND APK
      # =========================================================

      - name: Find APK
        if: always()
        run: |

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          echo ""
          echo "bin directory:"

          if [ -d "bin" ]; then
            find bin \
              -type f \
              -name "*.apk" \
              -print \
              -exec ls -lh {} \;
          else
            echo "bin directory does not exist."
          fi

          echo ""
          echo "All APK files in project:"

          find . \
            -type f \
            -name "*.apk" \
            ! -path "./.git/*" \
            -print \
            -exec ls -lh {} \; || true


      # =========================================================
      # 18. VERIFY APK
      # =========================================================

      - name: Verify APK
        if: success()
        run: |

          set -e

          echo "========================================"
          echo "VERIFY APK"
          echo "========================================"

          if [ ! -d "bin" ]; then

            echo "ERROR: bin directory does not exist."

            exit 1

          fi

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR: APK was not generated."

            exit 1

          fi

          echo ""
          echo "APK generated successfully."

          find bin \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;


      # =========================================================
      # 19. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-APK

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 30


      # =========================================================
      # 20. COLLECT BUILD LOGS
      # =========================================================

      - name: Collect build logs
        if: failure()
        run: |

          echo "========================================"
          echo "COLLECTING BUILD INFORMATION"
          echo "========================================"

          mkdir -p build_logs

          echo ""
          echo "Project files:"
          find . \
            -maxdepth 3 \
            -type f \
            ! -path "./.git/*" \
            > build_logs/project_files.txt || true

          echo ""
          echo "Buildozer directory:"

          if [ -d ".buildozer" ]; then

            du -sh .buildozer \
              > build_logs/buildozer_size.txt \
              2>&1 || true

            find .buildozer \
              -maxdepth 5 \
              -type f \
              | head -5000 \
              > build_logs/buildozer_files.txt \
              2>&1 || true

          fi

          echo ""
          echo "Disk:"
          df -h \
            > build_logs/disk.txt \
            2>&1 || true


      # =========================================================
      # 21. UPLOAD BUILD LOGS
      # =========================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4

        with:

          name: MohandSanskritOCR-build-logs

          path: |
            build_logs/
            .buildozer/android/platform/build-arm64-v8a/build/python-installs/
            .buildozer/android/platform/build-arm64-v8a/build/other_builds/

          if-no-files-found: ignore

          retention-days: 7
