name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    steps:

      # ====================================================
      # Checkout
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ====================================================
      # Python
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ====================================================
      # System dependencies
      # ====================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache


      # ====================================================
      # Python packages
      # ====================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ====================================================
      # Verify project
      # ====================================================

      - name: Verify project
        run: |

          set -e

          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          find . -maxdepth 4 -type f | sort


          echo
          echo "========================================"
          echo "MODEL"
          echo "========================================"

          test -f assets/best.tflite

          ls -lh assets/best.tflite


          echo
          echo "========================================"
          echo "CLASSES"
          echo "========================================"

          test -f classes.txt

          CLASS_COUNT=$(grep -cve '^[[:space:]]*$' classes.txt)

          echo "Classes: $CLASS_COUNT"

          if [ "$CLASS_COUNT" -ne 46 ]; then
            echo "ERROR: Expected 46 classes, found $CLASS_COUNT"
            exit 1
          fi


          echo
          echo "========================================"
          echo "OCR PROCESSOR"
          echo "========================================"

          test -f ocr_processor.py

          python -m py_compile ocr_processor.py

          echo "ocr_processor.py syntax OK"


          echo
          echo "========================================"
          echo "MAIN"
          echo "========================================"

          test -f main.py

          python -m py_compile main.py

          echo "main.py syntax OK"


          echo
          echo "========================================"
          echo "BUILD SPEC"
          echo "========================================"

          test -f buildozer.spec

          echo "buildozer.spec found"


      # ====================================================
      # Verify Buildozer configuration
      # ====================================================

      - name: Verify Buildozer configuration
        run: |

          echo "========================================"
          echo "BUILDOZER SPEC"
          echo "========================================"

          sed -n '1,240p' buildozer.spec


      # ====================================================
      # Cache
      # ====================================================

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:

          path: |
            ~/.buildozer
            .buildozer

          key: |
            buildozer-${{ runner.os }}-${{ hashFiles(
              'buildozer.spec',
              'ocr_processor.py',
              'main.py',
              'classes.txt'
            ) }}

          restore-keys: |
            buildozer-${{ runner.os }}-


      # ====================================================
      # Build APK
      # ====================================================

      - name: Build APK
        run: |

          set -e

          echo "========================================"
          echo "BUILD APK"
          echo "========================================"

          buildozer -v android debug


      # ====================================================
      # List APK
      # ====================================================

      - name: List APK
        if: always()
        run: |

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          if [ -d bin ]; then

            find bin \
              -maxdepth 2 \
              -type f \
              -print \
              -exec ls -lh {} \;

          else

            echo "bin directory does not exist"

          fi


      # ====================================================
      # Upload APK
      # ====================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:

          name: MohandOCR-APK

          path: bin/*.apk

          if-no-files-found: error
